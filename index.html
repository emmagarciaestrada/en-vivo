<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>En vivo · Avisos del SMN</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#14171a;--muted:#5d6670;--line:#dde1e6;--red:#d93a3a;--green:#2f9e5b}
  @media (prefers-color-scheme:dark){:root{--bg:#111315;--card:#1b1e21;--text:#eef0f2;--muted:#98a2ad;--line:#2b3035}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
  .zona{display:flex;gap:8px;margin-bottom:12px}
  select{flex:1;padding:12px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .estado{border-left:6px solid var(--green)}
  .estado.alerta{border-left-color:var(--red)}
  .estado .big{font-size:22px;font-weight:700;line-height:1.25;margin:2px 0 4px}
  .tag{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .aviso h3{font-size:16px;margin:4px 0}
  .aviso .hora{color:var(--muted);font-size:13px}
  .aviso .donde{font-size:14px;margin:6px 0 0}
  .badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--red);color:#fff;margin-right:6px}
  .note{font-size:13px;color:var(--muted)}
  .estado.naranja{border-left-color:#e8801a}
  .estado.gris{border-left-color:var(--muted)}
  .tor{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
  .tor:first-child{margin-top:10px}
  .tor b{display:block}
</style>
</head>
<body>
<main>
  <h1>⛈️ En vivo · Avisos del SMN</h1>
  <p class="sub" id="sub">Cargando…</p>

  <div class="zona">
    <select id="partido" aria-label="Elegí tu zona"></select>
  </div>

  <section class="card estado" id="estado" aria-live="polite">
    <span class="tag">Tu zona</span>
    <div class="big" id="big">Consultando al SMN…</div>
    <div id="det" class="note"></div>
  </section>

  <section class="card estado" id="rayos" aria-live="polite">
    <span class="tag">Rayos cerca de Pilar · satélite</span>
    <div class="big" id="rbig">Mirando el cielo…</div>
    <div id="rdet" class="note"></div>
    <div id="rlista"></div>
    <div id="redad" class="note"></div>
  </section>

  <div id="lista"></div>

  <p class="note">Datos oficiales del Servicio Meteorológico Nacional (CC BY 4.0). Es un proyecto personal, no reemplaza los canales oficiales de emergencia.</p>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var PREF='Pilar';
  function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
  function hora(iso){
    if(!iso)return '';
    var d=new Date(iso);
    return d.toLocaleString('es-AR',{weekday:'short',hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'});
  }
  function tocaA(av,p){
    return av.zonas.some(function(z){return z.partidos.some(function(x){return norm(x)===norm(p)})});
  }
  fetch('/api/alertas').then(function(r){return r.json()}).then(function(d){
    if(d.error)throw new Error(d.error);
    var avisos=d.avisos||[];
    $('sub').textContent=avisos.length+' avisos vigentes en Argentina';
    var set={};
    avisos.forEach(function(a){a.zonas.forEach(function(z){z.partidos.forEach(function(p){set[p]=z.provincia})})});
    set[PREF]=set[PREF]||'BUENOS AIRES';
    var nombres=Object.keys(set).sort(function(a,b){return a.localeCompare(b,'es')});
    var sel=$('partido');
    nombres.forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n+' ('+set[n]+')';if(n===PREF)o.selected=true;sel.appendChild(o)});
    function pintar(){
      var p=sel.value;
      var mios=avisos.filter(function(a){return tocaA(a,p)});
      var e=$('estado');
      if(mios.length){
        e.className='card estado alerta';
        $('big').textContent=mios.length===1?'Hay un aviso para '+p:'Hay '+mios.length+' avisos para '+p;
        $('det').textContent=mios.map(function(a){return a.titulo.toLowerCase()}).join(' · ');
      }else{
        e.className='card estado';
        $('big').textContent='Sin avisos del SMN para '+p+' ahora';
        $('det').textContent='Eso no asegura que no llueva: solo significa que no hay un aviso oficial vigente.';
      }
      var L=$('lista');L.innerHTML='';
      avisos.forEach(function(a){
        var c=document.createElement('div');c.className='card aviso';
        var zonas=a.zonas.map(function(z){return z.provincia+': '+z.partidos.join(', ')}).join(' — ');
        c.innerHTML='<div class="hora"></div><h3></h3><div class="donde"></div>';
        c.children[0].textContent='Emitido '+hora(a.emitido);
        c.children[1].textContent=a.titulo;
        c.children[2].textContent=zonas;
        if(a.granizo){var b=document.createElement('span');b.className='badge';b.textContent='GRANIZO';c.insertBefore(b,c.children[1])}
        L.appendChild(c);
      });
    }
    sel.onchange=pintar;pintar();
  }).catch(function(e){
    $('sub').textContent='';
    $('big').textContent='No pude leer los avisos';
    $('det').textContent=String(e);
  });
})();
</script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var NOM=['norte','noreste','este','sudeste','sur','sudoeste','oeste','noroeste'];
  function dir(e,n){var g=(Math.atan2(e,n)*180/Math.PI+360)%360;return NOM[Math.round(g/45)%8]}
  function texto(t){
    switch(t.estado){
      case 'sobre': return 'está encima de Pilar';
      case 'se_acerca': return 'llegaría en ~'+t.llegaEnMin+' min';
      case 'pasa_de_largo': return 'pasa de largo (a unos '+t.pasaAKm+' km)';
      case 'se_aleja': return 'se aleja';
      case 'lejos_aun': return 'se acerca, pero todavía falta más de 3 horas';
      case 'casi_estacionaria': return 'casi no se mueve';
      default: return 'todavía no se sabe hacia dónde va';
    }
  }
  function cargar(){
    fetch('/api/tormentas').then(function(r){return r.json()}).then(function(d){
      if(d.error)throw new Error(d.error);
      var r=d.resumen||{}, c=$('rayos'), L=$('rlista');
      L.innerHTML='';
      if(r.estado==='sobre'){
        c.className='card estado alerta';
        $('rbig').textContent='⚡ Hay una tormenta sobre Pilar';
        $('rdet').textContent='Quedate bajo techo y alejate de ventanas.';
      }else if(r.estado==='se_acerca'){
        c.className='card estado '+(r.llegaEnMin<=60?'alerta':'naranja');
        $('rbig').textContent='Una tormenta llegaría a Pilar en ~'+r.llegaEnMin+' min';
        $('rdet').textContent='Hoy está a '+r.distanciaKm+' km y se mueve hacia el '+r.haciaDonde+' a unos '+r.rapidezKmh+' km/h. Es una estimación: si cambia de rumbo, cambia el aviso.';
      }else if(r.estado==='hay_tormentas_pero_no_llegan'){
        c.className='card estado gris';
        $('rbig').textContent='Hay tormentas en la zona, pero ninguna se dirige a Pilar';
        $('rdet').textContent='La más cercana está a '+r.masCercanaKm+' km.';
      }else{
        c.className='card estado';
        $('rbig').textContent='Sin tormentas con rayos cerca de Pilar';
        $('rdet').textContent='En los últimos 20 minutos no hubo grupos de rayos en 350 km a la redonda.';
      }
      (d.tormentas||[]).slice(0,4).forEach(function(t){
        var x=document.createElement('div');x.className='tor';
        var b=document.createElement('b');
        b.textContent='A '+t.distanciaKm+' km al '+dir(t.posicionKm.este,t.posicionKm.norte)+' · '+t.rayos+' rayos';
        var s=document.createElement('span');
        s.textContent=(t.haciaDonde?'Se mueve al '+t.haciaDonde+' a ~'+t.rapidezKmh+' km/h · ':'')+texto(t);
        x.appendChild(b);x.appendChild(s);L.appendChild(x);
      });
      $('redad').textContent='Datos del satélite de hace '+d.ultimoArchivoHace_s+' segundos. Se actualiza solo cada 2 minutos.';
    }).catch(function(e){
      $('rbig').textContent='No pude leer los rayos ahora';
      $('rdet').textContent=String(e);
    });
  }
  cargar();
  setInterval(cargar,120000);
})();
</script>
</body>
</html>
